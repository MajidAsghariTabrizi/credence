<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace">
  <defs><style>
    .box{fill:#12100c;stroke:#3a352d}
    .t{fill:#f0ece3;font-size:15px}
    .s{fill:#8a8378;font-size:11px;letter-spacing:2px}
    .d{fill:#5c564c;font-size:11px}
    .sig{fill:#e8552f}.blu{fill:#6686d9}
    .arr{stroke:#8a8378;stroke-width:1;marker-end:url(#a)}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
  </style>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#8a8378"/>
  </marker></defs>
  <rect width="980" height="560" fill="#0c0a08"/>
  <rect x="60" y="30" width="860" height="86" class="box"/>
  <text x="84" y="58" class="s">AGENTS</text>
  <text x="84" y="84" class="t">worker · lead · watcher · operator</text>
  <text x="84" y="104" class="d">may propose learning — may not commit</text>
  <line x1="490" y1="116" x2="490" y2="152" class="arr flow"/>
  <rect x="60" y="152" width="860" height="86" class="box"/>
  <text x="84" y="180" class="s">HARNESS</text>
  <text x="84" y="206" class="t">lifecycle · tools · obligations · orchestration</text>
  <text x="84" y="226" class="d">keel — missions as durable state, resumed by any clean process</text>
  <line x1="490" y1="238" x2="490" y2="274" class="arr flow"/>
  <rect x="60" y="274" width="860" height="118" class="box"/>
  <text x="84" y="302" class="s">BRAIN KERNEL</text>
  <text x="84" y="328" class="t">ask · explain · investigate · learn · pulse</text>
  <text x="84" y="352" class="d">graded support — measured &gt; inferred &gt; reported</text>
  <text x="84" y="372" class="d">UNKNOWN is an answer · supersession never erases</text>
  <line x1="300" y1="392" x2="300" y2="428" class="arr flow"/>
  <line x1="490" y1="392" x2="490" y2="428" class="arr flow"/>
  <line x1="680" y1="392" x2="680" y2="428" class="arr flow"/>
  <rect x="160" y="428" width="280" height="100" class="box"/>
  <text x="184" y="456" class="s">PACK</text>
  <text x="184" y="482" class="t">ground-control</text>
  <text x="184" y="504" class="d">events.jsonl — append-only</text>
  <rect x="350" y="428" width="280" height="100" class="box"/>
  <text x="374" y="456" class="s">PACK</text>
  <text x="374" y="482" class="t">flight-ops</text>
  <text x="374" y="504" class="d">events.jsonl — append-only</text>
  <rect x="540" y="428" width="280" height="100" class="box"/>
  <text x="564" y="456" class="s">PACK</text>
  <text x="564" y="482" class="t">your-domain</text>
  <text x="564" y="504" class="d">events.jsonl — append-only</text>
  <text x="896" y="546" text-anchor="end" class="d">credence · architecture</text>
</svg>

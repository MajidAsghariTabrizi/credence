<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" font-family="'Cascadia Mono','JetBrains Mono',Consolas,monospace">
  <!-- Long-mission survival: RUNNING → PROCESS DEAD → RESTART → RESUMED, with
       the mission log carrying the pid change visibly. -->
  <defs><style>
    .n{fill:#12100c;stroke:#3a352d}
    .t{fill:#f0ece3;font-size:14px}
    .s{fill:#8a8378;font-size:10px;letter-spacing:2px}
    .dim{fill:#5c564c;font-size:11px}
    .sig{fill:#e8552f}.ok{fill:#7a9b5e}
    .arr{stroke:#8a8378;stroke-width:1;marker-end:url(#a)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .dead{animation:pulse 1.4s steps(2,jump-none) infinite}
  </style>
  <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8378"/></marker></defs>
  <rect width="980" height="240" fill="#0c0a08"/>
  <text x="40" y="36" class="s">MISSION SURVIVAL — STATE ON DISK, NOT IN MEMORY</text>
  <rect x="40" y="60" width="180" height="52" class="n"/><text x="62" y="82" class="t ok">RUNNING</text><text x="62" y="100" class="dim">pid 53048 · step 5/8</text>
  <line x1="220" y1="86" x2="270" y2="86" class="arr"/>
  <rect x="270" y="60" width="200" height="52" class="n dead"/><text x="292" y="82" class="t sig">PROCESS DEAD</text><text x="292" y="100" class="dim">kill -9. nothing lost.</text>
  <line x1="470" y1="86" x2="520" y2="86" class="arr"/>
  <rect x="520" y="60" width="170" height="52" class="n"/><text x="542" y="82" class="t">RESTART</text><text x="542" y="100" class="dim">clean process</text>
  <line x1="690" y1="86" x2="740" y2="86" class="arr"/>
  <rect x="740" y="60" width="200" height="52" class="n"/><text x="762" y="82" class="t ok">RESUMED</text><text x="762" y="100" class="dim">pid 24452 · step 6/8</text>
  <!-- the durable log strip -->
  <rect x="40" y="140" width="900" height="72" fill="#12100c" stroke="#3a352d"/>
  <text x="60" y="162" class="dim">mission-started  objective="transmit science backlog"  steps=8</text>
  <text x="60" y="178" class="dim">mission-step    5/8  integrity-check payload CRC   [pid 53048]</text>
  <text x="60" y="194" class="ok">mission-resumed from step 5                        [pid 24452] ← zero memory</text>
  <text x="920" y="226" text-anchor="end" class="dim">npm run demo:kill</text>
</svg>
